- title: "Medical Sociology"
  level: "Graduate"
  terms: "Spring 2017"
  description: "This course starts from the idea that we cannot understand health and illness by looking only at biology and medical knowledge; we must also consider social, political, economic, and cultural forces. We use sociological perspectives and methods to study the meanings of illness, who gets sick, how people seek help, how doctors, nurses, and patients interact, and how some problems come to be seen as medical."

