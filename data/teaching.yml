  - text: "The class is intellectually stimulating, and it may force you to think about society in a different perspective."
    who: "Introductory Sociology for Healthcare Professions"
  - text: "Covered advanced material without being overwhelming. … Gave a lot of really helpful, practical information that we can use immediately in our work."
    who: "Regression Models for Categorical Data"
