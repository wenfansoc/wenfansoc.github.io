# News and events, newest first. text = HTML (links/italics allowed). Homepage shows the first 3; the rest sit under "Earlier news".
# Items through 2025-11 copied from the old WordPress site (2026-10-02).
- date: "2025-11"
  text: 'I had the great pleasure of visiting and giving a talk at the Cornell ILR Seminar, hosted by the Department of Global Labor and Work.'

- date: "2025-11"
  text: 'My paper with Phyllis Moen on work-place captivity and well-being, “Human Meanings of Evolving Employment Geographies: Work-Place Captivity and Well-Being Dynamics,” is forthcoming in <i>Social Psychology Quarterly</i>.'

- date: "2025-11"
  text: 'A handbook chapter I wrote with Duanyi Yang on flexible working arrangements during the COVID-19 pandemic has just been published in <a target="_blank" rel="noopener" href="https://www.e-elgar.com/shop/usd/a-research-agenda-for-flexible-working-arrangements-9781035317615.html"><i>A Research Agenda for Flexible Working Arrangements</i></a>.'

- date: "2025-11"
  text: 'Two papers with Yue Qian—titled “<a target="_blank" rel="noopener" href="https://journals.sagepub.com/doi/10.1177/18681026251392281">Economic Risks and Mental Health During China’s 2020 COVID-19 Outbreak: A Mixed-Methods Approach</a>” and “<a target="_blank" rel="noopener" href="https://journals.sagepub.com/doi/10.1177/00197939251390748">Did the COVID-19 Pandemic Make it Worse? Working from Home and Affective Well-being at the Intersections of Parental Status and Occupation</a>“—are forthcoming in <i>Journal of Current Chinese Affairs</i> and <i>ILR Review</i>, respectively.'

- date: "2025-10"
  text: 'I am co-editing, with Senhu Wang, a collection for <i>Scientific Report</i> on <a target="_blank" rel="noopener" href="https://www.nature.com/collections/hffegeidbh">remote work and social anxiety</a>. The collection is now open and accepting submissions until May 2026.'

- date: "2025-09"
  text: 'I had a wonderful conversation with Jason and Joelle on the <a target="_blank" rel="noopener" href="https://www.psychhealthandsafety.com/episodes/wellbeing-and-the-4-day-work-week-with-dr-wen-fan">Psych Health and Safety Podcast</a>, discussing well-being findings from the four-day workweek project.'

- date: "2025-07"
  text: 'My paper with Yue Qian, titled “Did the COVID-19 Pandemic Make it Worse? Working from Home and Affective Well-being at the Intersections of Parental Status and Occupation” is forthcoming in <i>ILR Review</i>.'

- date: "2025-07"
  text: 'Our first paper from the four-day workweek project, titled “<a target="_blank" rel="noopener" href="https://www.nature.com/articles/s41562-025-02259-6">Work Time Reduction Via a Four-day Week Finds Improvements in Workers’ Well-being</a>” (coauthored with Juliet Schor, Orla Kelly, and Guolin Guo), has just been published in <i>Nature Human Behaviour</i>! The paper has been featured in <a target="_blank" rel="noopener" href="https://www.nature.com/articles/d41586-025-02295-2" target="_blank">Nature News</a>,  <a target="_blank" rel="noopener" href="https://www.scientificamerican.com/article/biggest-trial-of-four-day-workweek-finds-workers-are-happier-and-feel-just/" target="_blank">Scientific American</a>,  <a target="_blank" rel="noopener" href="https://www.sciencefocus.com/news/four-day-work-week-benefits" target="_blank">BBC Science Focus</a>,  <a target="_blank" rel="noopener" href="https://www.newscientist.com/article/2488976-four-day-working-week-may-boost-our-health-and-performance-at-work/" target="_blank">New Scientist</a>,  <a target="_blank" rel="noopener" href="https://www.euronews.com/health/2025/07/21/four-day-work-weeks-are-good-for-employees-mental-and-overall-health-pilots-in-6-countries" target="_blank">Euronews</a>,  <a target="_blank" rel="noopener" href="https://gizmodo.com/new-study-bolsters-public-health-case-for-a-four-day-work-week-2000632007" target="_blank">Gizmodo</a>,  <a target="_blank" rel="noopener" href="https://www.businessinsider.com/workers-try-four-day-workweek-burnout-mental-health-research-productivity-2025-7" target="_blank">Business Insider</a>,  <a target="_blank" rel="noopener" href="https://www.inc.com/tekendra-parmar/ai-companies-are-adopting-a-996-work-culture-studies-show-it-actually-hurts-productivity/91219951" target="_blank">Inc. Magazine</a>,  <a target="_blank" rel="noopener" href="https://www.bbc.com/audio/play/live/bbc_world_service" target="_blank">BBC World Service</a>,  <a target="_blank" rel="noopener" href="https://www.siriusxm.com/hosts/michael-smerconish" target="_blank">SiriusXM Radio</a>,  <a target="_blank" rel="noopener" href="https://www.abc.net.au/listen/programs/sydney-breakfast/sydney-breakfast/105547594" target="_blank">ABC Sydney Breakfast</a> (Australia),  <a target="_blank" rel="noopener" href="https://www1.folha.uol.com.br/equilibrioesaude/2025/07/trabalhar-quatro-dias-e-folgar-tres-faz-bem-a-saude-diz-pesquisa.shtml" target="_blank">Folha de S.Paulo</a> (Brazil),  <a target="_blank" rel="noopener" href="https://cmp.seznam.cz/nastaveni-souhlasu?service=bcr&return_url=https%3A%2F%2Fwww.seznamzpravy.cz%2Fclanek%2Fzahranicni-ctyrdenni-pracovni-tyden-uspel-v-dalsi-velke-zkousce-ale-ma-to-hacek-282556%3Fcwreturn%3D1&cwtime=1754242201200&loginstate=forget&cwri=c1c28df9005707cd754f350ecf0dff7b&reason=missing" target="_blank">Seznam Zpravy</a> (Czechia),  <a target="_blank" rel="noopener" href="https://seanduke.blog/2025/07/21/irish-linked-study-reveals-why-working-a-four-day-week-is-good-for-your-health/" target="_blank">Science Spinning</a> (Ireland),  <a target="_blank" rel="noopener" href="https://scientias.nl/vierdaagse-werkweek-blijkt-in-groot-experiment-opnieuw-enorm-succes-waarom-ook-werkgevers-overstag-gaan/" target="_blank">Scientias.nl</a> (Netherlands),  <a target="_blank" rel="noopener" href="https://elpais.com/salud-y-bienestar/2025-07-21/ciencia-para-constatar-lo-evidente-trabajar-menos-mejora-la-salud-mental-y-fisica.html" target="_blank">El País</a> (Spain), and  <a target="_blank" rel="noopener" href="https://www.eldiario.es/economia/estudio-refleja-problemas-dormir-burnout-trabajadores-aplicar-semana-laboral-4-dias_1_12472870.html" target="_blank">elDiario.es</a> (Spain).'

- date: "2025-07"
  text: 'My paper with Yue Qian, titled “<a target="_blank" rel="noopener" href="https://read.dukeupress.edu/demography/article-abstract/doi/10.1215/00703370-12159081/401985/Whose-Parents-Matter-Intergenerational?redirectedFrom=fulltext">Whose Parents Matter? Intergenerational Transmission of Earnings Arrangements in Different-Sex Couples: A Research Note</a>” has just been published in <i>Demography</i>.'

- date: "2025-05"
  text: 'A collaborative paper with Richard Petts and Dan Carlson, titled “<a target="_blank" rel="noopener" href="https://journals.sagepub.com/doi/10.1177/21568693251344326">Work-place Mismatch, Work-Family Conflict, and Psychological Well-being among Parents</a>” is forthcoming in <i>Society and Mental Health</i>. <a target="_blank" rel="noopener" href="https://thesocietypages.org/ccf/2025/08/19/is-remote-hybrid-or-on-site-work-best-for-workers-it-depends-on-their-preferences/">Here</a> is an accompanying blog post.'

- date: "2025-02"
  text: 'My paper with Phyllis Moen, titled “<a target="_blank" rel="noopener" href="https://academic.oup.com/sf/advance-article/doi/10.1093/sf/soaf035/8037774?searchresult=1&login=true">Remote/Hybrid Work in Flux: Work-Place/Preference Mismatch and Adaptations</a>” is forthcoming in <i>Social Forces</i>. See <a target="_blank" rel="noopener" href="https://www.wenfan.co/remote-work/#mismatch">here</a> for a summary.'

- date: "2025-01"
  text: 'My paper with Phyllis Moen (<a target="_blank" rel="noopener" href="https://journals.sagepub.com/eprint/HI98CMRHEBJWHSQFHJMC/full">The Future(s) of Work? Disparities Around Changing Job Conditions When Remote/Hybrid or Returning to Working at Work </a>) has been published in <i>Work and Occupations</i>. See <a target="_blank" rel="noopener" href="https://www.wenfan.co/remote-work/#future-work">here</a> for a summary.'

- date: "2025-01"
  text: 'A coauthored paper with Ya Guo, Wanying Ling, and Senhu Wang (<a target="_blank" rel="noopener" href="https://www.sciencedirect.com/science/article/pii/S0276562424001215?dgcid=coauthor">Work-schedule instability and workers’ health and well-being across different socioeconomic strata in China </a>) has been published in <i>Research in Social Stratification and Mobility</i>.'

- date: "2024-11"
  text: 'Participated in an event organized by Chinese Students Association and the Women’s Center at BC to discuss the meaning of being an Asian woman. It was wonderful to be part of the Asian women’s community at BC.'

- date: "2024-10"
  text: 'I gave a talk on work-place mismatch at the Brown Bag Lecture Series hosted by Penn State’s Population Research Institute.'

- date: "2024-04"
  text: 'I will give a talk on remote work at the 2024 Marconi Research Conference, organized by the <a target="_blank" rel="noopener" href="https://oerc.org">Office Ergonomics Research Committee</a>. Cannot wait to share the findings and engage in discussions with companies interested in remote/hybrid work!'

- date: "2024-04"
  text: 'Julie Schor and I have been awarded a two-year grant for <a target="_blank" rel="noopener" href="https://www.bc.edu/bc-web/centers/schiller-institute/research/schiller-institute-faculty-grants/si-ritea-grants.html">Research in Targeted and Emerging Areas</a> by the Schiller Institute.'

- date: "2024-04"
  text: 'My paper “Becoming a Parent: Trajectories of Family Division of Labor in Germany and the United States” is now available <a target="_blank" rel="noopener" href="https://www.sciencedirect.com/science/article/pii/S1569490924000224?dgcid=author">online</a> at <i>Advances in Life Course Research</I>.'

- date: "2024-03"
  text: 'Gave a talk on remote work and four-day workweeks at the “Workshop on New Perspectives on Work: Unemployment, Remote Work, Platform Work, and Workplace Inequality,” organized by <a target="_blank" rel="noopener" href="https://sociology.rutgers.edu/people/faculty/core-department-faculty/core-department-faculty-member/809-mai-quan">Quan Mai</a> at Rutgers. I’m so honored to have received the invitation, and it was truly a privilege to share the forum with so many scholars I deeply admire!'

- date: "2024-02"
  text: 'I have been awarded a BC Research Incentive Grant to embark on a new research project this summer!'

- date: "2024-02"
  text: 'Gave an inaugural seminar at the <a target="_blank" rel="noopener" href="https://www.wtr-rn.com">Work Time Reduction Research Network (WTR-RN)</a> with Julie Schor.'

- date: "2024-01"
  text: 'My paper with Phyllis Moen “<a target="_blank" rel="noopener" href="https://www.mdpi.com/2076-0760/13/1/36">The Shifting Stress of Working Parents: An Examination of Dual Pandemic Disruptions—Remote Work and Remote Schooling</a>” has just been published in <i>Social Sciences</i>.'

- date: "2023-12"
  text: 'My paper “Becoming a Parent: Trajectories of Family Division of Labor in Germany and the United States” has just been accepted in <i>Advances in Life Course Research</i>.'

- date: "2023-12"
  text: 'Gave a talk at the  University of Texas Health Science Center at Houston and received tons of interesting and useful questions!'

- date: "2023-11"
  text: 'Did <a target="_blank" rel="noopener" href="https://www.cbc.ca/news/canada/newfoundland-labrador/days-planned-to-the-minute-cost-of-living-1.7037331">an interview</a> with CBC for their “The Grind” series.'

- date: "2023-11"
  text: 'A briefing paper on <a target="_blank" rel="noopener" href="https://sites.utexas.edu/contemporaryfamilies/2023/11/14/covid-19-and-gender-equality-symposium-remote-work/">remote/hybrid work and gender equality</a> with Richard Petts!'

- date: "2023-11"
  text: 'A paper with Yue Qian on <a target="_blank" rel="noopener" href="https://onlinelibrary.wiley.com/doi/10.1111/1468-4446.13067">stressful life events and mental well-being during COVID-19</a> is forthcoming in <i>British Journal of Sociology</i>.'

- date: "2023-11"
  text: 'I testified before the Massachusetts Joint Committee on Labor and Workforce Development to make the case for a four-day workweek pilot program—my first time testifying! Here is a <a target="_blank" rel="noopener" href="https://www.telegram.com/story/news/state/2023/11/14/4-day-workweek-plan-pitched-by-mass-progressives/71578955007/">Telegram report</a>.'

- date: "2023-11"
  text: 'I will be joining the editorial board of the <i>Journal of Marriage and Family</i> in 2024.'

- date: "2023-10"
  text: 'Presented a paper on remote work at the SLLS annual conference at Munich.'

- date: "2023-09"
  text: 'My paper with Phyllis Moen—<a target="_blank" rel="noopener" href="https://journals.sagepub.com/doi/10.1177/07308884231203668">The Future(s) of Work? Disparities around Changing Job Conditions when Remote/Hybrid or Returning to Working at Work</a>—is forthcoming at <i>Work and Occupations</i>. See <a target="_blank" rel="noopener" href="https://www.wenfan.co/remote-work/#future-work">here</a> for a summary.'

- date: "2023-09"
  text: 'Interviewed by <a target="_blank" rel="noopener" href="https://www.npr.org/2023/09/11/1198394085/uaw-big-3-automakers-4-day-work-week-shawn-fain-detroit">NPR</a>, <a target="_blank" rel="noopener" href="https://www.usatoday.com/story/money/2023/09/18/uaw-demands-four-day-workweek/70890162007/">USA TODAY</a>, and <a target="_blank" rel="noopener" href="https://scrippsnews.com/stories/uaw-workers-asking-automakers-for-shorter-workweek/">Scripps News</a> on the four-day workweek component of the UAW strikes.'

- date: "2023-08"
  text: 'Interviewed by <a target="_blank" rel="noopener" href="https://www.fastcompany.com/90932623/so-youve-decided-to-implement-a-4-day-workweek-now-what">Fast Company</a> on the exciting findings from four-day workweek trials.'

- date: "2023-08"
  text: 'My paper with Yue Qian (<a target="_blank" rel="noopener" href="https://link.springer.com/article/10.1007/s10902-023-00669-9">State Contexts, Job Insecurity, and Subjective Well-being in the Time of COVID-19</a>) was just published in <i>Journal of Happiness Studies</i>.'

- date: "2023-06"
  text: 'Attended the ISA conference at Melbourne and met some old friends—my very second attendance of ISA after the 2014 Yokohama conference (when I was still a grad student!).'

- date: "2023-06"
  text: 'Co-wrote an <a target="_blank" rel="noopener" href="https://www.latimes.com/opinion/story/2023-06-06/four-day-workweek-california-congress-research">opinion piece</a> with Julie Schor for Los Angeles Times on the four-day workweek.'

- date: "2023-05"
  text: 'Gave <a target="_blank" rel="noopener" href="https://www.neebc.org/index.php?option=com_dailyplanetblog&view=entry&year=2023&month=06&day=07&id=123:how-a-flexible-workforce-approach-helps-organizations-grow-and-thrive">a talk</a> at the New England Employee Benefits Council Annual Summit on workplace flexibility.'

- date: "2023-05"
  text: 'I will co-organize (with Jaeseung Kim) the Graduate Students Pre-conference Workshop for the 2024 WFRN Conference at Montreal—very excited to co-organize again after an extremely rewarding experience with Yvonne Lott in 2022.'

