{{ define "main" }}
<div class="wrap">
  <article class="page">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ .Content }}
    {{ if .Pages }}
    <ul>
      {{ range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
    {{ end }}
  </article>
</div>
{{ end }}
