<style>
  :root{
    --bg:#FBFAF7; --surface:#FFFFFF; --ink:#1E1915; --muted:#6E655C;
    --line:#E8E1D6; --accent:#7C1D2B; --accent-soft:rgba(124,29,43,.10);
    --gold:#A9853F; --ring:rgba(124,29,43,.16);
    --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
    --measure:44rem;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14100E; --surface:#1C1815; --ink:#ECE6DE; --muted:#A79D92;
      --line:#2E2823; --accent:#C56A6F; --accent-soft:rgba(197,106,111,.14);
      --gold:#C7A25A; --ring:rgba(197,106,111,.22);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14100E; --surface:#1C1815; --ink:#ECE6DE; --muted:#A79D92;
    --line:#2E2823; --accent:#C56A6F; --accent-soft:rgba(197,106,111,.14);
    --gold:#C7A25A; --ring:rgba(197,106,111,.22);
  }
  :root[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --ink:#1E1915; --muted:#6E655C;
    --line:#E8E1D6; --accent:#7C1D2B; --accent-soft:rgba(124,29,43,.10);
    --gold:#A9853F; --ring:rgba(124,29,43,.16);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.65;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:var(--measure); margin:0 auto; padding:0 22px}
  main{min-height:60vh}

  /* ---- nav ---- */
  nav{
    position:sticky; top:0; z-index:10;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(8px);
    -webkit-backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-in{max-width:var(--measure); margin:0 auto; padding:12px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:.01em}
  .brand a{color:var(--ink); text-decoration:none}
  .nav-links{display:flex; align-items:center; gap:20px; flex-wrap:wrap}
  .nav-links a{
    color:var(--muted); text-decoration:none; font-size:13.5px;
    text-transform:uppercase; letter-spacing:.09em; font-weight:600;
    transition:color .18s;
  }
  .nav-links a:hover,.nav-links a.active{color:var(--accent)}
  .toggle{
    appearance:none; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); width:34px; height:34px; border-radius:50%;
    cursor:pointer; display:grid; place-items:center; transition:.18s; flex:0 0 auto;
  }
  .toggle:hover{color:var(--accent); border-color:var(--ring)}
  .toggle svg{width:16px; height:16px}
  .toggle .moon{display:none}
  :root[data-theme="dark"] .toggle .moon{display:block}
  :root[data-theme="dark"] .toggle .sun{display:none}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .toggle .moon{display:block}
    :root:not([data-theme="light"]) .toggle .sun{display:none}
  }

  /* ---- hero (home) ---- */
  header.hero{padding:52px 0 8px}
  .hero-grid{display:flex; gap:34px; align-items:flex-start}
  .hero-text{flex:1 1 auto; min-width:0}
  .avatar-wrap{flex:0 0 auto}
  .avatar{
    width:172px; height:172px; border-radius:50%; object-fit:cover;
    display:block; box-shadow:0 0 0 5px var(--surface), 0 0 0 6px var(--ring),
      0 18px 40px -18px rgba(0,0,0,.4);
  }
  h1.name{
    font-family:var(--serif); font-weight:600; letter-spacing:-.01em;
    font-size:clamp(2.3rem,7vw,3rem); line-height:1.04; margin:2px 0 2px;
    text-wrap:balance;
  }
  .tagline{
    font-family:var(--serif); font-style:italic; color:var(--muted);
    font-size:clamp(1.15rem,3.4vw,1.4rem); line-height:1.3; margin:0 0 18px;
    min-height:1.4em;
  }
  .tagline .typed{color:var(--accent); font-style:normal; font-weight:600}
  .caret{
    display:inline-block; width:2px; height:1.05em; margin-left:2px;
    background:var(--gold); transform:translateY(3px);
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .socials{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px}
  .socials a{
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 12px; border:1px solid var(--line); border-radius:999px;
    color:var(--muted); text-decoration:none; font-size:13px; font-weight:600;
    background:var(--surface); transition:.18s;
  }
  .socials a:hover{color:var(--accent); border-color:var(--ring); transform:translateY(-1px)}
  .socials svg{width:15px; height:15px}

  /* ---- home sections ---- */
  section{padding:30px 0}
  .eyebrow{
    font-size:12px; text-transform:uppercase; letter-spacing:.16em;
    color:var(--accent); font-weight:700; margin:0 0 14px;
    display:flex; align-items:center; gap:12px;
  }
  .eyebrow::after{content:""; flex:1; height:1px; background:var(--line)}
  section > p{margin:0 0 16px; max-width:38rem}
  a.inline{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--ring)}
  a.inline:hover{border-bottom-color:var(--accent)}

  /* ---- selected-work cards (home) ---- */
  .pubs{display:flex; flex-direction:column}
  .pub{padding:20px 0; border-top:1px solid var(--line); display:flex; gap:18px}
  .pub:first-child{border-top:none; padding-top:4px}
  .pub .yr{
    flex:0 0 auto; font-family:var(--serif); font-size:15px; color:var(--gold);
    font-weight:600; width:3.2em; padding-top:2px; font-variant-numeric:tabular-nums;
  }
  .pub .body{flex:1 1 auto; min-width:0}
  .pub .t{font-weight:650; color:var(--ink); line-height:1.4}
  .pub .meta{color:var(--muted); font-size:15px; margin-top:3px}
  .pub .meta em{font-family:var(--serif); font-style:italic; color:var(--ink)}
  .pub .note{color:var(--muted); font-size:14.5px; margin-top:7px; line-height:1.55}
  .pub .links{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap}
  .pub .links a{
    font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--accent); text-decoration:none; padding:3px 10px;
    border:1px solid var(--ring); border-radius:6px; transition:.16s;
  }
  .pub .links a:hover{background:var(--accent-soft)}
  .more{margin-top:22px; font-size:15px}
  .awards-line{color:var(--muted); font-size:14px; margin:10px 0 0}
  .awards-line strong{color:var(--accent)}

  /* ---- content pages (markdown) ---- */
  .page{padding:44px 0 8px}
  .page-title{
    font-family:var(--serif); font-weight:600; letter-spacing:-.01em;
    font-size:clamp(2rem,5.5vw,2.6rem); line-height:1.06; margin:0 0 6px;
    text-wrap:balance;
  }
  .page-title + p, .page > p:first-of-type{color:var(--muted)}
  .page h2{
    font-family:var(--serif); font-weight:600; font-size:1.5rem; line-height:1.2;
    margin:2.2em 0 .7em; padding-bottom:.32em; border-bottom:1px solid var(--line);
    text-wrap:balance;
  }
  .page h3{font-family:var(--serif); font-weight:600; font-size:1.2rem; margin:1.6em 0 .5em}
  .page p{margin:0 0 1em; max-width:40rem}
  .page a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--ring)}
  .page a:hover{border-bottom-color:var(--accent)}
  .page strong{font-weight:700; color:var(--ink)}
  .page em{font-family:var(--serif); font-style:italic}
  .page hr{border:none; border-top:1px solid var(--line); margin:2em 0}
  .page blockquote{
    margin:1.2em 0; padding:.4em 0 .4em 1.1em; border-left:3px solid var(--ring);
    color:var(--muted); font-style:italic;
  }
  /* bibliography-style lists (publications / research) */
  .page ul{list-style:none; padding:0; margin:0 0 1.2em}
  .page ul li{
    position:relative; margin:0 0 .85em; padding-left:1.2em;
    color:var(--ink); font-size:15.5px; line-height:1.55; max-width:42rem;
  }
  .page ul li::before{
    content:""; position:absolute; left:0; top:.62em;
    width:5px; height:5px; border-radius:50%; background:var(--gold);
  }
  .page ul li em{color:var(--ink)}
  .page ol{padding-left:1.2em; margin:0 0 1.2em}
  .page ol li{margin:0 0 .6em}
  .page table{border-collapse:collapse; width:100%; margin:1.2em 0; font-size:15px}
  .page th,.page td{text-align:left; padding:8px 12px; border-bottom:1px solid var(--line)}
  .page th{color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-size:12px}

  /* ---- al-folio-style bibliography ---- */
  .biblio{margin-top:.5em}
  .page h2.bib-year{font-size:1.7rem; color:var(--ink); margin-top:1.8em}
  .bib-entry{padding:15px 0; border-top:1px solid var(--line)}
  .bib-year + .bib-entry{border-top:none}
  .bib-entry.selected{
    border-left:3px solid var(--gold); padding-left:15px;
    background:linear-gradient(to right, var(--accent-soft), transparent 55%);
    border-radius:0 8px 8px 0;
  }
  .bib-title{font-weight:650; color:var(--ink); font-size:1.04rem; line-height:1.38; letter-spacing:-.005em}
  .bib-authors{color:var(--muted); font-size:14.5px; margin-top:4px; line-height:1.5}
  .bib-authors b{color:var(--ink); font-weight:700}
  .bib-venue{font-size:14.5px; margin-top:2px; color:var(--muted)}
  .bib-venue em{font-family:var(--serif); font-style:italic; color:var(--ink)}
  .bib-award{
    display:inline-block; margin-top:9px; font-size:12px; font-weight:700;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--ring);
    border-radius:999px; padding:3px 11px; letter-spacing:.01em;
  }
  .bib-award::before{content:"★ "; color:var(--gold)}
  .bib-links{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px}
  .page .bib-links a, .page .course-links a{
    display:inline-block;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    color:var(--accent); text-decoration:none; padding:3px 10px;
    border:1px solid var(--ring); border-radius:5px; background:var(--surface);
    transition:background .15s, border-color .15s;
  }
  .page .bib-links a:hover, .page .course-links a:hover{background:var(--accent-soft); border-color:var(--accent)}

  /* ---- teaching course cards (al-folio style) ---- */
  .courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:16px; margin-top:1.5em}
  .course-card{
    border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px;
    background:var(--surface); transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .course-card:hover{border-color:var(--ring); transform:translateY(-2px);
    box-shadow:0 14px 30px -20px rgba(0,0,0,.35)}
  .course-level{
    display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    font-weight:700; color:var(--accent); background:var(--accent-soft);
    border:1px solid var(--ring); padding:3px 10px; border-radius:999px;
  }
  .course-title{font-family:var(--serif); font-weight:600; font-size:1.16rem; line-height:1.25; margin:13px 0 5px}
  .course-terms{color:var(--muted); font-size:13.5px; font-variant-numeric:tabular-nums}
  .course-desc{margin-top:9px; font-size:14px; color:var(--muted); line-height:1.5}
  .course-links{margin-top:13px}

  /* ---- footer ---- */
  footer.site{border-top:1px solid var(--line); margin-top:40px; padding:26px 0 46px}
  .footer-in{max-width:var(--measure); margin:0 auto; padding:0 22px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    color:var(--muted); font-size:13.5px}
  .footer-in a{color:var(--muted); text-decoration:none; border-bottom:1px solid transparent}
  .footer-in a:hover{color:var(--accent); border-bottom-color:var(--ring)}
  .footer-links{display:flex; gap:16px; flex-wrap:wrap}

  @media (max-width:620px){
    .hero-grid{flex-direction:column-reverse; align-items:center; text-align:center; gap:20px}
    .socials{justify-content:center}
    header.hero{padding:34px 0 4px}
    section > p{margin-left:auto; margin-right:auto}
  }
  @media (prefers-reduced-motion:reduce){
    .caret{animation:none}
    html{scroll-behavior:auto}
  }
</style>
