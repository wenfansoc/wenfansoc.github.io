{{- /* Small line drawing for a course: the shape the course is about. Called with the glyph name. */ -}}
{{- $g := . -}}
<svg class="t-glyph" viewBox="0 0 120 60" aria-hidden="true" focusable="false">
{{- if eq $g "trouble" }}
  {{- /* One person with a trouble; step back, and many people share it. */}}
  {{- partial "teaching-person.html" (dict "x" 10 "y" 30 "acc" true) }}
  <path d="M24 30h12M32 26l4 4-4 4" class="g-line"/>
  {{- range $r := slice 14 34 54 }}{{ range $c := slice 50 63 76 89 102 115 }}
  {{- $on := in (slice "14-63" "34-89" "34-50" "54-76" "14-115" "54-102") (printf "%d-%d" $r $c) }}
  {{- partial "teaching-person.html" (dict "x" $c "y" $r "acc" $on "s" 0.8) }}
  {{- end }}{{ end }}
{{- else if eq $g "medical" }}
  {{- /* Medicine in the middle, people all around it. */}}
  <path d="M55 20h10v10h10v10H65v10H55V40H45V30h10z" class="g-acc-fill"/>
  {{- range slice (slice 22 14) (slice 98 14) (slice 14 38) (slice 106 38) (slice 30 56) (slice 90 56) (slice 60 6) }}
  {{- partial "teaching-person.html" (dict "x" (index . 0) "y" (index . 1) "acc" false "s" 0.85) }}
  {{- end }}
{{- else if eq $g "self" }}
  {{- /* An org chart; one of its places is a person. */}}
  <rect x="48" y="2" width="24" height="12" rx="2" class="g-line g-brief"/>
  <path d="M60 14v6M22 20h76M22 20v6M60 20v6M98 20v6M60 38v6M44 44h32M44 44v4M76 44v4" class="g-line"/>
  <rect x="10" y="26" width="24" height="12" rx="2" class="g-line g-brief"/>
  <rect x="48" y="26" width="24" height="12" rx="2" class="g-line g-brief"/>
  <rect x="86" y="26" width="24" height="12" rx="2" class="g-line g-brief"/>
  <rect x="34" y="48" width="20" height="10" rx="2" class="g-line g-brief"/>
  {{- partial "teaching-person.html" (dict "x" 76 "y" 54 "acc" true "s" 0.8) }}
{{- else if eq $g "regression" }}
  {{- /* Scatter with a fitted line. */}}
  {{- range slice (slice 10 46) (slice 20 44) (slice 26 36) (slice 36 40) (slice 44 30) (slice 52 34) (slice 60 26) (slice 70 28) (slice 78 20) (slice 88 22) (slice 96 14) (slice 108 12) }}
  <circle cx="{{ index . 0 }}" cy="{{ index . 1 }}" r="2.6" class="g-mut-fill"/>
  {{- end }}
  <path d="M4 48L116 8" class="g-line g-acc"/>
{{- else if eq $g "logit" }}
  {{- /* Outcomes at 0 and 1, with an S-shaped curve between. */}}
  {{- range slice 8 18 26 34 44 58 }}<circle cx="{{ . }}" cy="52" r="2.4" class="g-mut-fill"/>{{ end }}
  {{- range slice 64 76 86 96 104 114 }}<circle cx="{{ . }}" cy="8" r="2.4" class="g-mut-fill"/>{{ end }}
  <path d="M4 50C40 50 46 48 60 30S80 10 116 10" class="g-line g-acc"/>
{{- else if eq $g "panel" }}
  {{- /* The same cases measured at four points in time. */}}
  {{- range $i, $ys := slice (slice 44 38 30 26) (slice 30 32 22 14) (slice 50 44 46 36) (slice 20 24 16 18) }}
  <path d="M10 {{ index $ys 0 }}L43 {{ index $ys 1 }}L76 {{ index $ys 2 }}L110 {{ index $ys 3 }}" class="g-line{{ if eq $i 0 }} g-acc{{ end }}"/>
  {{- range $j, $x := slice 10 43 76 110 }}<circle cx="{{ $x }}" cy="{{ index $ys $j }}" r="2.4" class="{{ if eq $i 0 }}g-acc-fill{{ else }}g-mut-fill{{ end }}"/>{{ end }}
  {{- end }}
{{- else if eq $g "survival" }}
  {{- /* A survival curve stepping down, and three sequences of states below it. */}}
  <path d="M4 4h18v6h14v7h16v5h20v6h18v4h26" class="g-line g-acc"/>
  {{- range $i, $row := slice (slice 30 40 46) (slice 18 52 46) (slice 44 20 52) }}
  {{- $y := add 40 (mul $i 7) }}
  <rect x="4" y="{{ $y }}" width="{{ index $row 0 }}" height="4.5" rx="1" class="g-s1"/>
  <rect x="{{ add 5 (index $row 0) }}" y="{{ $y }}" width="{{ index $row 1 }}" height="4.5" rx="1" class="g-s2"/>
  <rect x="{{ add 6 (add (index $row 0) (index $row 1)) }}" y="{{ $y }}" width="{{ sub 110 (add (index $row 0) (index $row 1)) }}" height="4.5" rx="1" class="g-s3"/>
  {{- end }}
{{- end }}
</svg>
